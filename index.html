<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<meta name="monetag" content="ac619191cf58e3a3e7f4bc817034fab4">
<title>ShockTV — Cine, series y anime</title>
<meta name="description" content="Mirá películas, series y anime en ShockTV. Rápido y liviano.">
<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Config del sitio (mismo archivo de siempre). Debe cargar ANTES del script principal. -->
<script src="config.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   ShockTV — NEURAL UI  ·  sistema de diseño nuevo, escrito de cero
   ───────────────────────────────────────────────────────────────
   Lenguaje visual:
   · Fondo: aurora espectral + malla técnica tenue (sensación IA).
   · Superficies: paneles "vidrio sólido" con borde de 1px y luz
     interior arriba (sin backdrop-filter, para gama baja).
   · Forma firma: esquinas asimétricas 18/6px — se repite en
     tarjetas, paneles y botones, y es lo que hace reconocible la app.
   · Marcas: corchete superior izquierdo en tarjetas, número de
     ranking, y acentos cian→violeta→magenta.
   La pantalla de carga NO se toca: su bloque va al final, textual.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#05060e;
  --panel:#0b0d1c;
  --panel-2:#11142a;
  --line:rgba(150,160,255,.13);
  --line-2:rgba(150,160,255,.22);
  --txt:#eaecff;
  --muted:#858bb8;
  --dim:#5f648f;

  --cy:#35e0ff;
  --vi:#8b6cff;
  --mg:#ff54d0;
  --accent:#35e0ff;
  --accent-2:#ff54d0;
  --accent-grad:linear-gradient(115deg,#35e0ff,#8b6cff 52%,#ff54d0);
  --spectrum:linear-gradient(90deg,#35e0ff,#8b6cff,#ff54d0,#35e0ff);
  --holo:linear-gradient(150deg,rgba(53,224,255,.85),rgba(139,108,255,.5) 42%,rgba(255,84,208,.7));
  --glow-cy:rgba(53,224,255,.45);
  --glow-vi:rgba(139,108,255,.55);
  --glow-mg:rgba(255,84,208,.45);

  --r-lg:20px;          /* radio grande */
  --cut:18px 6px 18px 6px;  /* forma firma asimétrica */
  --font-display:'Kanit',system-ui,sans-serif;
  --dock-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  position:relative;
  background:
    radial-gradient(900px 480px at 50% -12%, rgba(139,108,255,.20), transparent 60%),
    radial-gradient(700px 400px at 4% 26%, rgba(53,224,255,.10), transparent 56%),
    radial-gradient(760px 420px at 100% 44%, rgba(255,84,208,.09), transparent 56%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 30px);
  overscroll-behavior-y:none;
}
/* Malla técnica de fondo: da textura "sistema/IA" sin costo de pintura */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(150,160,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(150,160,255,.045) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(circle at 50% 22%,#000,transparent 78%);
  mask-image:radial-gradient(circle at 50% 22%,#000,transparent 78%)}
body>*{position:relative;z-index:1}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none !important}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spectrumShift{0%{background-position:0% center}100%{background-position:200% center}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ── Isla superior flotante (reemplaza la vieja barra pegada) ── */
.top{
  position:sticky;top:calc(env(safe-area-inset-top) + 8px);z-index:40;
  margin:calc(env(safe-area-inset-top) + 8px) 14px 0;
  display:flex;align-items:center;gap:10px;padding:9px 10px 9px 14px;
  border-radius:var(--r-lg);
  background:linear-gradient(180deg,rgba(20,23,48,.96),rgba(10,12,28,.96));
  border:1px solid var(--line);
  box-shadow:0 12px 30px -14px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.06)}
.logo{
  font-family:var(--font-display);font-weight:900;font-style:italic;
  font-size:22px;letter-spacing:.6px;text-transform:uppercase;line-height:1;
  transform:skewX(-7deg);padding:2px 1px;
  background:linear-gradient(100deg,#35e0ff,#ffffff 22%,#8b6cff 46%,#ff54d0 66%,#35e0ff 100%);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:spectrumShift 6s linear infinite;
  filter:drop-shadow(0 0 12px rgba(139,108,255,.55)) drop-shadow(0 2px 3px rgba(0,0,0,.9))}
.logo b{background:linear-gradient(100deg,#ffffff,#35e0ff 40%,#ffffff);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.top-sp{flex:1}
/* Contador de gente conectada: cápsula con punto vivo */
.live-badge{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:700;
  padding:4px 9px;border-radius:99px;background:rgba(53,224,255,.07);border:1px solid rgba(53,224,255,.2)}
.live-badge b{color:var(--cy);font-weight:800}
.online-dot{width:6px;height:6px;border-radius:99px;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:live 2s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.ic-btn{width:36px;height:36px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;color:#cfd4ff;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease,color .15s ease}
.ic-btn:active{color:#fff;border-color:rgba(53,224,255,.6);box-shadow:0 0 18px -5px var(--glow-cy);transform:scale(.92)}
.fav-dot{position:relative}
.fav-dot b{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--accent-grad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;
  border:2px solid #0c0e1f;box-shadow:0 0 12px var(--glow-mg)}

/* ── Bloque de bienvenida + buscador ── */
.quickbar{padding:18px 16px 4px;display:flex;flex-direction:column;gap:12px}
.qb-hi{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#fff}
.qb-hi b{font-weight:800;background:var(--spectrum);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:spectrumShift 7s linear infinite}
.search-pill{display:flex;align-items:center;gap:11px;width:100%;padding:13px 12px 13px 15px;
  border-radius:var(--cut);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
  border:1px solid var(--line);text-align:left;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .15s ease,box-shadow .15s ease,transform .12s ease}
.search-pill svg{width:18px;height:18px;flex:0 0 auto;color:var(--cy)}
.sp-txt{flex:1;min-width:0;color:var(--dim);font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-pill:active{border-color:rgba(53,224,255,.55);box-shadow:0 0 24px -8px var(--glow-cy);transform:scale(.99)}
/* Sello IA: aparece en el buscador y en la ficha */
.ai-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:800;letter-spacing:.16em;padding:5px 10px;border-radius:99px;color:#fff;
  background:var(--accent-grad);box-shadow:0 0 16px -3px var(--glow-vi)}

/* ── Riel de secciones: subrayado luminoso en vez de píldora rellena ── */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:14px 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;white-space:nowrap;padding:9px 14px 12px;font-weight:700;font-size:14px;color:var(--dim);
  letter-spacing:.01em;transition:color .18s ease}
.tab::after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2.5px;border-radius:99px;
  background:var(--accent-grad);opacity:0;transform:scaleX(.35);transform-origin:center;
  transition:opacity .2s ease,transform .2s ease}
.tab.on{color:#fff}
.tab.on::after{opacity:1;transform:scaleX(1);box-shadow:0 0 14px var(--glow-vi)}
.tab:active{color:#cfd4ff}

/* ── Destacado: panel cinematográfico con corte de esquina ── */
.spot{position:relative;margin:4px 16px 26px;border-radius:26px 8px 26px 8px;overflow:hidden;
  background:var(--panel);aspect-ratio:16/10;
  box-shadow:0 24px 50px -20px rgba(0,0,0,.95),0 0 44px -16px var(--glow-vi);
  animation:fadeUp .4s ease both}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;z-index:3;pointer-events:none;
  background:var(--holo);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.spot-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spot-grad{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(5,6,14,0) 22%,rgba(5,6,14,.72) 62%,rgba(5,6,14,.97)),
  linear-gradient(90deg,rgba(5,6,14,.55),transparent 55%)}
.spot-body{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 18px;display:flex;flex-direction:column;min-width:0;z-index:2}
.spot-kick{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#fff;
  padding:5px 11px;border-radius:99px;background:rgba(139,108,255,.18);border:1px solid rgba(139,108,255,.5);
  box-shadow:0 0 18px -6px var(--glow-vi)}
.spot-title{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.02em;margin:10px 0 5px;line-height:1.08;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.9)}
.spot-meta{font-size:12.5px;color:#b9bee6;margin-bottom:13px;font-weight:500}
.spot-btn{align-self:flex-start;background:var(--accent-grad);color:#fff;
  font-weight:800;font-size:14.5px;padding:12px 24px;border-radius:14px 5px 14px 5px;display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 14px 32px -12px var(--glow-vi),inset 0 1px 0 rgba(255,255,255,.35);
  transition:filter .15s ease,transform .12s ease}
.spot-btn:active{filter:brightness(1.12);transform:scale(.97)}

/* ── Encabezado de fila: numeral técnico + título ── */
.row{margin:0 0 26px}
.row-head{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;gap:12px}
.row-title{position:relative;font-family:var(--font-display);font-size:18px;font-weight:800;letter-spacing:-.01em;color:#fff;
  display:flex;align-items:center;gap:9px;min-width:0}
.row-title::before{content:"";width:9px;height:9px;flex:0 0 auto;border-radius:2px;transform:rotate(45deg);
  background:var(--accent-grad);box-shadow:0 0 14px var(--glow-vi)}
.row-more{flex:0 0 auto;font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:6px 12px;border-radius:99px;border:1px solid var(--line);transition:color .15s ease,border-color .15s ease}
.row-more:active{color:var(--cy);border-color:rgba(53,224,255,.5)}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;
  scroll-snap-type:x proximity;scrollbar-width:none;
  content-visibility:auto;contain-intrinsic-size:auto 272px}
.row-scroll::-webkit-scrollbar{display:none}

/* ── Tarjeta: póster con corte de esquina y corchete de marca ── */
.card{flex:0 0 auto;width:136px;scroll-snap-align:start;animation:fadeUp .3s ease both}
.card-thumb{position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--cut);overflow:hidden;background:var(--panel);
  box-shadow:0 12px 24px -14px rgba(0,0,0,.95)}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease,filter .18s ease}
/* borde holográfico */
.card-thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.1px;pointer-events:none;z-index:3;
  background:var(--holo);opacity:.55;transition:opacity .2s ease;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
/* velo inferior para que el badge y el corte se lean */
.card-thumb::before{content:"";position:absolute;left:0;right:0;bottom:0;height:38%;z-index:1;
  background:linear-gradient(180deg,transparent,rgba(5,6,14,.7))}
.card:active .card-thumb::after{opacity:1}
.card:active .card-thumb img{filter:brightness(.82);transform:scale(1.04)}
@media(hover:hover){
  .card:hover .card-thumb img{transform:scale(1.06)}
  .card:hover .card-thumb::after{opacity:1}
  .card:hover .card-thumb{box-shadow:0 16px 32px -14px rgba(0,0,0,1),0 0 28px -6px var(--glow-vi)}
}
.card-badge{position:absolute;left:8px;top:8px;z-index:4;
  font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:7px 2px 7px 2px;
  background:rgba(5,6,14,.78);color:#fff;border:1px solid var(--line-2)}
.card-badge.mv{color:var(--cy);border-color:rgba(53,224,255,.5)}
.card-badge.sr{color:#b9a4ff;border-color:rgba(139,108,255,.55)}
.card-badge.an{color:#ff9ae4;border-color:rgba(255,84,208,.5)}
.card-t{font-family:var(--font-display);font-weight:700;font-size:13px;color:#e9ebff;line-height:1.3;margin-top:9px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:6px;margin-top:5px}
.card-score{font-size:11.5px;font-weight:800;color:var(--cy)}
.card-sub{font-size:11px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Estrellas con relleno parcial: el ancho de <b> es la calificación */
.stars{position:relative;display:inline-block;font-size:10.5px;line-height:1;letter-spacing:1px;color:#272a4d}
.stars i,.stars b{font-style:normal;font-weight:400}
.stars b{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;
  background:linear-gradient(90deg,#35e0ff,#8b6cff,#ff54d0);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── Grillas y cabeceras de sección ── */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;padding:6px 16px 26px}
@media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:760px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(7,1fr)}}
.grid .card{width:100%}
.section-h{padding:18px 16px 2px;font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;
  color:#fff}
.section-sub{padding:6px 16px 14px;color:var(--muted);font-size:13px;max-width:640px}
.load-more{display:block;margin:6px auto 30px;padding:12px 30px;border-radius:14px 5px 14px 5px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line-2);color:#dfe3ff;font-weight:800;letter-spacing:.04em;font-size:13.5px}
.load-more:active{border-color:rgba(53,224,255,.6);box-shadow:0 0 22px -8px var(--glow-cy)}
.empty{padding:64px 24px;text-align:center;color:var(--muted);font-size:14px}
.empty svg{opacity:.45;margin-bottom:14px}
.sk{background:linear-gradient(100deg,#0c0f21,#1a1f42,#241a45,#0c0f21);background-size:200% 100%;
  animation:spectrumShift 1.9s linear infinite;border-radius:var(--cut);aspect-ratio:2/3}

/* ── Panel lateral ── */
.side-ov{position:fixed;inset:0;z-index:55;background:rgba(3,4,12,0);pointer-events:none;transition:background .25s ease}
.side-ov.open{background:rgba(3,4,12,.74);pointer-events:auto}
.side{position:fixed;top:0;left:0;bottom:0;width:256px;max-width:80vw;z-index:56;
  background:linear-gradient(180deg,#0e1128,#07091a 55%,#05060e);
  border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 14px);overflow-y:auto}
.side::after{content:"";position:absolute;top:0;right:-1px;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--cy),var(--vi) 50%,var(--mg));opacity:.65}
.side-ov.open .side{transform:translateX(0)}
.side-title{padding:16px 18px 8px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:800}
.side-item{display:flex;align-items:center;gap:14px;padding:12px 16px;margin:2px 10px;border-radius:14px 4px 14px 4px;
  font-size:14px;font-weight:600;color:#c9cdf0;width:calc(100% - 20px);text-align:left;
  transition:background .15s ease,color .15s ease}
.side-item svg{width:21px;height:21px;flex:0 0 auto;color:var(--dim);transition:color .15s ease}
.side-item.on{color:#fff;background:linear-gradient(100deg,rgba(53,224,255,.16),rgba(139,108,255,.08) 60%,transparent);
  box-shadow:inset 0 0 0 1px rgba(53,224,255,.28)}
.side-item.on svg{color:var(--cy)}
.side-item:active{background:rgba(255,255,255,.05)}
.side-item .news-dot{width:7px;height:7px;border-radius:99px;background:var(--mg);margin-left:auto;flex:0 0 auto;
  box-shadow:0 0 0 0 var(--glow-mg);animation:live 2s ease-out infinite}
.side-sep{height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent);margin:12px 16px}
/* ── Pie del panel: visitas totales ── */
.side-foot{margin-top:auto;padding:14px 12px calc(env(safe-area-inset-bottom) + 14px)}
.stat-card{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;
  border-radius:16px 5px 16px 5px;
  background:linear-gradient(100deg,rgba(53,224,255,.08),rgba(139,108,255,.06) 55%,rgba(255,84,208,.07));
  border:1px solid var(--line)}
.stat-card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:var(--holo);opacity:.4;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.stat-ic{width:36px;height:36px;flex:0 0 auto;border-radius:11px 3px 11px 3px;display:grid;place-items:center;color:var(--cy);
  background:rgba(53,224,255,.1);border:1px solid rgba(53,224,255,.28)}
.stat-ic svg{width:19px;height:19px}
.stat-tx{min-width:0;display:flex;flex-direction:column;gap:1px}
.stat-tx b{font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:.01em;line-height:1.1;
  background:var(--spectrum);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-tx span{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.side-toggle{display:flex;align-items:center;gap:14px;padding:12px 16px;margin:2px 10px;width:calc(100% - 20px);
  font-size:14px;font-weight:600;color:#c9cdf0;text-align:left;border-radius:14px 4px 14px 4px}
.side-toggle svg{width:21px;height:21px;flex:0 0 auto;color:var(--dim)}
.switch{width:44px;height:26px;border-radius:99px;background:rgba(255,255,255,.08);position:relative;flex:0 0 auto;
  border:1px solid var(--line-2);transition:background .18s ease,border-color .18s ease}
.switch::after{content:"";position:absolute;top:2px;left:3px;width:20px;height:20px;border-radius:50%;background:#9298c9;
  transition:transform .2s cubic-bezier(.3,.8,.3,1),background .18s ease;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.switch.on{background:var(--accent-grad);border-color:transparent;box-shadow:0 0 18px -4px var(--glow-vi)}
.switch.on::after{transform:translateX(17px);background:#fff}

/* Modo "Forzar 60 FPS": promueve zonas de scroll a capa GPU y apaga
   todo lo decorativo (gradientes animados, malla, halos) para dejar el
   mínimo trabajo por frame en equipos de gama baja. */
html.fps60 .row-scroll,html.fps60 .grid,html.fps60 .card-thumb img,html.fps60 .spot-img{
  will-change:transform;transform:translateZ(0);backface-visibility:hidden}
html.fps60{scroll-behavior:auto}
html.fps60 body::before{display:none}
html.fps60 .card,html.fps60 .spot,html.fps60 .sheet,html.fps60 .tab,html.fps60 .card-thumb img,
html.fps60 .side-item,html.fps60 .news-dot,html.fps60 .spot-btn,html.fps60 .btn-play,html.fps60 .logo,
html.fps60 .qb-hi b,html.fps60 .boot-art,html.fps60 .boot-ring,html.fps60 .dock-b{
  animation:none !important;transition-duration:.001s !important}
html.fps60 .orbs{display:none}

@media(min-width:900px){
  body{padding-left:256px;padding-bottom:30px}
  .side-ov{position:static;background:none !important;pointer-events:auto;z-index:auto}
  .side{position:fixed;transform:translateX(0) !important;height:100vh}
  .bnav{display:none}
  header.top button.ic-btn:first-child{display:none}
}

/* ── Buscador ── */
.search-ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  background:radial-gradient(760px 420px at 50% 0%, rgba(139,108,255,.18), transparent 60%),var(--bg)}
.search-bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px}
.search-bar input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:var(--cut);
  padding:13px 15px;color:var(--txt);font-size:15px;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
.search-bar input::placeholder{color:var(--dim)}
.search-bar input:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(53,224,255,.12),0 0 26px -8px var(--glow-cy)}
.search-close{color:var(--muted);font-weight:700;padding:8px 4px;font-size:14px}
.search-results{flex:1;overflow-y:auto}

/* ── Ficha (hoja inferior) ── */
.sheet-ov{position:fixed;inset:0;z-index:70;background:rgba(3,4,12,.76);display:flex;align-items:flex-end}
.sheet{position:relative;width:100%;max-height:90vh;overflow-y:auto;border-radius:28px 28px 0 0;
  background:linear-gradient(180deg,#0f1230,#07091a 60%);
  box-shadow:0 -10px 60px -14px var(--glow-vi);animation:fadeUp .28s cubic-bezier(.3,.8,.3,1) both}
.sheet::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:44px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.28);z-index:5}
.sheet-hero{position:relative}
.sheet-back{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--panel)}
.sheet-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,18,48,.35) 0%,transparent 30%,#0d1029)}
.sheet-x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:99px;background:rgba(5,6,14,.7);
  border:1px solid var(--line-2);color:#fff;display:grid;place-items:center;font-size:18px;z-index:4}
.sheet-x:active{background:rgba(0,0,0,.9)}
.sheet-body{padding:0 18px 26px;margin-top:-46px;position:relative}
.sheet-title{font-family:var(--font-display);font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.08;color:#fff}
.sheet-meta{color:var(--muted);font-size:12.5px;margin:10px 0 16px;display:flex;flex-wrap:wrap;gap:6px 12px;font-weight:600}
.sheet-meta .star{color:var(--cy);font-weight:800}
.sheet-actions{display:flex;gap:10px;margin-bottom:18px}
.btn-play{flex:1;background:var(--accent-grad);color:#fff;font-weight:800;font-size:15px;padding:15px;
  border-radius:16px 5px 16px 5px;display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 16px 34px -14px var(--glow-vi),inset 0 1px 0 rgba(255,255,255,.35);
  transition:filter .15s ease,transform .12s ease}
.btn-play:active{filter:brightness(1.12);transform:scale(.98)}
.btn-list{width:54px;border:1px solid var(--line-2);border-radius:16px 5px 16px 5px;background:rgba(255,255,255,.04);
  display:grid;place-items:center;color:var(--muted);transition:color .15s ease,border-color .15s ease,box-shadow .15s ease}
.btn-list.on{color:var(--mg);border-color:var(--mg);box-shadow:0 0 22px -6px var(--glow-mg)}
.sheet-desc{font-size:14px;color:#c2c7ea;margin-bottom:20px;line-height:1.6}
.sheet-sec-t{font-size:10.5px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.2em;margin:0 0 12px}
.cast{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cast::-webkit-scrollbar{display:none}
.cast-p{flex:0 0 auto;width:68px;text-align:center}
.cast-p img{width:68px;height:68px;border-radius:99px;object-fit:cover;background:var(--panel);
  border:1.5px solid var(--line-2);box-shadow:0 0 18px -8px var(--glow-vi)}
.cast-p span{display:block;font-size:11px;color:#b3b8dd;margin-top:7px;line-height:1.25}

/* ── Reproductor ── */
.ply-ov{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column;overflow-y:auto}
.ply-x{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:10px;z-index:3;
  width:36px;height:36px;border-radius:99px;background:rgba(5,6,14,.75);border:1px solid var(--line-2);color:#fff;
  display:grid;place-items:center;font-size:18px}
.ply-frame-wrap{position:sticky;top:0;z-index:2;width:100%;aspect-ratio:16/9;background:#000;flex:0 0 auto}
.ply-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ply-frame-wrap:fullscreen,.ply-frame-wrap:-webkit-full-screen{width:100vw;height:100vh;aspect-ratio:auto;background:#000}
.ply-frame-wrap:fullscreen iframe,.ply-frame-wrap:-webkit-full-screen iframe{width:100%;height:100%}
.ply-load{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.ply-ph{padding:44px 24px;text-align:center;color:var(--muted)}
.ply-ph .btn-play{max-width:230px;margin:18px auto 0}
.ply-info{padding:16px 16px 2px}
.ply-title-big{font-family:var(--font-display);font-size:18px;font-weight:800;line-height:1.25;margin-bottom:6px;color:#fff}
.ply-badge{font-size:12px;color:var(--cy);font-weight:800;letter-spacing:.06em}
.ply-tools{display:flex;flex-wrap:nowrap;gap:8px;padding:14px 16px}
.ply-tool{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px 4px 12px 4px;
  padding:10px;font-size:12px;font-weight:700;color:#dfe3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ply-tool svg{width:16px;height:16px}
.ply-tool:active{border-color:rgba(53,224,255,.5);box-shadow:0 0 18px -8px var(--glow-cy)}

/* Panel de fuentes y de temporadas */
.src-modal-ov,.season-modal-ov{position:fixed;inset:0;background:rgba(3,4,12,.76);display:flex;align-items:flex-end}
.src-modal-ov{z-index:85}.season-modal-ov{z-index:95}
.src-modal,.season-modal{position:relative;width:100%;max-height:72vh;overflow-y:auto;border-radius:26px 26px 0 0;
  background:linear-gradient(180deg,#0f1230,#07091a 65%);
  box-shadow:0 -10px 50px -16px var(--glow-vi);
  padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.src-modal-h,.season-modal-h{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2;
  background:#0f1230;padding:18px 18px 12px;font-family:var(--font-display);font-weight:800;font-size:19px;color:#fff}
.src-modal-h button,.season-modal-h button{color:var(--muted);font-size:20px;line-height:1;padding:4px 8px}
.src-modal-list,.season-modal-list{display:flex;flex-direction:column;gap:8px;padding:2px 14px}
.src-item,.season-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px 4px 14px 4px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);transition:border-color .15s ease,box-shadow .15s ease}
.season-item{justify-content:space-between;font-size:14px;font-weight:600;color:#c9cdf0;width:100%}
.src-item:active,.season-item:active{background:rgba(255,255,255,.07)}
.src-item.on,.season-item.on{border-color:rgba(53,224,255,.65);color:#fff;
  background:linear-gradient(100deg,rgba(53,224,255,.12),rgba(255,255,255,.03) 60%);box-shadow:0 0 24px -8px var(--glow-cy)}
.src-item .si-play{width:34px;height:34px;flex:0 0 auto;border-radius:10px 3px 10px 3px;background:rgba(53,224,255,.1);
  display:grid;place-items:center;color:var(--cy);font-size:12px;border:1px solid rgba(53,224,255,.28)}
.src-item.on .si-play{background:var(--accent-grad);color:#fff;border-color:transparent}
.src-item .si-name{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-item .si-tag{font-size:10.5px;color:var(--dim);font-weight:800;letter-spacing:.06em;flex:0 0 auto;text-transform:uppercase}
.src-item.on .si-tag{color:var(--cy)}
.season-item svg,.season-select svg{flex:0 0 auto;color:var(--cy)}

/* Episodios */
.eps-wrap{padding:8px 14px 26px}
.eps-h{font-size:10.5px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.2em;margin-bottom:12px}
.season-select{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:14px;margin-bottom:14px;border-radius:14px 4px 14px 4px;
  background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--txt);font-size:14px;font-weight:700;text-align:left}
.season-select:active{border-color:rgba(53,224,255,.6);box-shadow:0 0 20px -8px var(--glow-cy)}
.ep-list{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;gap:12px;align-items:center;padding:11px;border-radius:14px 4px 14px 4px;
  background:rgba(255,255,255,.03);border:1px solid var(--line);transition:border-color .15s ease,box-shadow .15s ease}
.ep.on{border-color:rgba(53,224,255,.65);box-shadow:0 0 22px -8px var(--glow-cy)}
.ep-num{width:36px;height:36px;flex:0 0 auto;border-radius:10px 3px 10px 3px;background:rgba(53,224,255,.1);
  display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--cy);border:1px solid rgba(53,224,255,.28)}
.ep.on .ep-num{background:var(--accent-grad);color:#fff;border-color:transparent}
.ep-info{min-width:0;flex:1}
.ep-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-ov{font-size:12px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ep-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:9px}
.ep-bar-fill{height:100%;width:0%;background:var(--accent-grad);border-radius:99px;transition:width .3s ease;
  box-shadow:0 0 12px var(--glow-vi)}

/* ── Dock inferior: ícono activo elevado en cápsula luminosa ── */
.bnav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:50;
  height:var(--dock-h);border-radius:24px 8px 24px 8px;
  background:linear-gradient(180deg,rgba(21,25,54,.98),rgba(9,11,26,.98));
  border:1px solid var(--line-2);
  box-shadow:0 18px 40px -14px rgba(0,0,0,1),inset 0 1px 0 rgba(255,255,255,.07);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.bnav-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--dim);font-size:9.5px;font-weight:800;letter-spacing:.04em;position:relative;height:100%;
  transition:color .18s ease}
.bnav-b svg{width:21px;height:21px;position:relative;z-index:1;transition:transform .22s cubic-bezier(.3,.9,.3,1)}
.bnav-b.on{color:#fff}
.bnav-b.on svg{transform:translateY(-2px);filter:drop-shadow(0 0 10px var(--glow-cy))}
.bnav-b.on::before{content:"";position:absolute;top:9px;width:44px;height:28px;border-radius:99px;z-index:0;
  background:linear-gradient(115deg,rgba(53,224,255,.3),rgba(139,108,255,.26) 55%,rgba(255,84,208,.26));
  box-shadow:0 0 22px -4px var(--glow-vi)}
.bnav-b:active{transform:scale(.93)}

/* ── Aviso flotante ── */
.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 26px);transform:translateX(-50%);z-index:90;
  background:#131735;border:1px solid var(--line-2);color:#eef0ff;padding:12px 22px;border-radius:99px;
  font-size:13px;font-weight:700;box-shadow:0 14px 34px -10px rgba(0,0,0,.95),0 0 26px -10px var(--glow-vi)}
/* ═══ Pantalla de arranque: entidad espectral + logo pegado ═══ */
.boot{position:fixed;inset:0;z-index:100;
  background:
    radial-gradient(760px 520px at 50% 34%, rgba(123,108,255,.22), transparent 62%),
    radial-gradient(520px 380px at 22% 68%, rgba(255,79,216,.10), transparent 60%),
    var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:hidden}
/* Orbes de energía flotando al fondo */
.orbs{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orbs i{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#3ee0ff 50%,rgba(62,224,255,0) 72%);
  box-shadow:0 0 10px 2px rgba(62,224,255,.5);
  animation:orbRise 7s linear infinite}
.orbs i:nth-child(even){background:radial-gradient(circle,#fff 0%,#ff4fd8 50%,rgba(255,79,216,0) 72%);box-shadow:0 0 10px 2px rgba(255,79,216,.45)}
@keyframes orbRise{
  0%{transform:translateY(0) scale(.5);opacity:0}
  14%{opacity:1}
  78%{opacity:.85}
  100%{transform:translateY(-108vh) scale(1.2);opacity:0}
}
.orbs i:nth-child(1){left:7%;animation-duration:7.6s;animation-delay:0s}
.orbs i:nth-child(2){left:15%;animation-duration:5.8s;animation-delay:1.9s;width:4px;height:4px}
.orbs i:nth-child(3){left:24%;animation-duration:8s;animation-delay:.8s}
.orbs i:nth-child(4){left:33%;animation-duration:6.2s;animation-delay:2.7s;width:6px;height:6px}
.orbs i:nth-child(5){left:42%;animation-duration:7s;animation-delay:.4s;width:3px;height:3px}
.orbs i:nth-child(6){left:51%;animation-duration:6s;animation-delay:3.3s}
.orbs i:nth-child(7){left:59%;animation-duration:7.8s;animation-delay:1.4s;width:4px;height:4px}
.orbs i:nth-child(8){left:67%;animation-duration:6.4s;animation-delay:2.2s}
.orbs i:nth-child(9){left:76%;animation-duration:5.9s;animation-delay:.7s;width:6px;height:6px}
.orbs i:nth-child(10){left:84%;animation-duration:7.4s;animation-delay:3s;width:3px;height:3px}
.orbs i:nth-child(11){left:91%;animation-duration:6.6s;animation-delay:1.7s}
.orbs i:nth-child(12){left:97%;animation-duration:7.2s;animation-delay:3.8s;width:4px;height:4px}
/* Bloque imagen + texto: pegados, sin separación */
.boot-stage{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;
  width:min(78vw,320px);animation:fadeUp .5s ease both}
.boot-art-wrap{position:relative;width:100%;aspect-ratio:1/1;display:grid;place-items:center;
  animation:floaty 5.5s ease-in-out infinite}
/* Halo detrás de la criatura, funde la imagen con el fondo */
.boot-art-wrap::before{content:"";position:absolute;left:50%;top:52%;width:118%;aspect-ratio:1/1;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(123,108,255,.35) 0%,rgba(62,224,255,.14) 38%,transparent 68%);border-radius:50%;z-index:0}
.boot-art{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 10px 34px rgba(123,108,255,.55))}
/* El logo se superpone a la base de la imagen: queda "pegado" a la criatura */
.boot .logo{position:relative;z-index:3;font-size:min(13vw,46px);margin-top:-9%;
  animation:spectrumShift 5s linear infinite;letter-spacing:1px}
.boot-msg{position:relative;z-index:3;color:var(--muted);font-size:13px;font-weight:600;max-width:300px;line-height:1.4;margin-top:10px;
  letter-spacing:.04em}
/* Barra de carga espectral */
.boot-ring{position:relative;z-index:3;margin-top:16px;width:150px;height:3px;border-radius:99px;background:#1b1b3a;overflow:hidden}
.boot-ring::after{content:"";position:absolute;top:0;bottom:0;width:45%;border-radius:99px;
  background:var(--accent-grad);box-shadow:0 0 14px rgba(123,108,255,1);
  animation:bootSlide 1.25s ease-in-out infinite}
@keyframes bootSlide{0%{left:-45%}100%{left:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<!-- Arranque -->
<div class="boot" id="boot">

/* ── fetch con caché + timeout ──────────────────────────────────
   Caché de dos niveles: memoria (instantánea) + disco (sobrevive al
   cerrar y reabrir la app). Guarda las respuestas de TMDB por 6 h, así
   volver al Inicio o reabrir el sitio no vuelve a descargar nada. */
const CACHE=new Map();
const CK="stv_c_", CACHE_TTL=6*3600*1000;
function diskGet(k){
  try{
    const raw=localStorage.getItem(CK+k);if(!raw)return null;
    const o=JSON.parse(raw);
    if(!o||Date.now()-o.t>CACHE_TTL){localStorage.removeItem(CK+k);return null;}
    return o.v;
  }catch(e){return null;}
}
function diskSet(k,v){
  try{localStorage.setItem(CK+k,JSON.stringify({t:Date.now(),v}));}
  catch(e){pruneCache();try{localStorage.setItem(CK+k,JSON.stringify({t:Date.now(),v}));}catch(e2){}}
}
function pruneCache(){ // si se llena el almacenamiento, tira lo más viejo
  try{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith(CK));
    keys.map(k=>{let t=0;try{t=JSON.parse(localStorage.getItem(k)).t||0;}catch(e){}return{k,t};})
        .sort((a,b)=>a.t-b.t).slice(0,Math.ceil(keys.length/2))
        .forEach(o=>localStorage.removeItem(o.k));
  }catch(e){}
}
async function fx(url,opts={},ms=9000){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);
  try{return await fetch(url,{...opts,signal:ctrl.signal});}finally{clearTimeout(t);}
}
async function tmdb(path){
  if(CACHE.has(path))return CACHE.get(path);
  const d=diskGet(path);
  if(d){CACHE.set(path,d);return d;}
  const r=await fx(TMDB+path,{headers:{accept:"application/json",Authorization:"Bearer "+TOKEN}});
  if(!r.ok)throw new Error("TMDB "+r.status);
  const j=await r.json();CACHE.set(path,j);diskSet(path,j);return j;
}

/* ── progreso de "visto" por episodio (series y anime, misma lógica) ──
   Se guarda el tiempo acumulado viendo cada episodio y se compara contra
   una duración estimada para pintar la barra en la lista. */
const PROG_KEY="stv_prog";
let PROGDB={};
try{PROGDB=JSON.parse(localStorage.getItem(PROG_KEY)||"{}");}catch(e){PROGDB={};}
function pruneProg(){
  const keys=Object.keys(PROGDB);
  if(keys.length<=250)return;
  keys.map(k=>({k,t:PROGDB[k].t||0})).sort((a,b)=>a.t-b.t)
      .slice(0,keys.length-250).forEach(x=>delete PROGDB[x.k]);
}
function saveProg(){
  try{localStorage.setItem(PROG_KEY,JSON.stringify(PROGDB));}
  catch(e){pruneProg();try{localStorage.setItem(PROG_KEY,JSON.stringify(PROGDB));}catch(e2){}}
}
function progKey(type,id,s,ep){return `${type}:${id}:${s||0}:${ep||0}`;}
function getProgPct(type,id,s,ep){
  const o=PROGDB[progKey(type,id,s,ep)];
  if(!o||!o.dur)return 0;
  return Math.min(100,Math.round((o.sec/o.dur)*100));
}
function setProgSec(type,id,s,ep,sec,dur){
  PROGDB[progKey(type,id,s,ep)]={sec,dur,t:Date.now()};
  saveProg();
}
let progTimer=null;
function stopProgressTimer(){if(progTimer){clearInterval(progTimer);progTimer=null;}}
function startProgressTimer(){
  stopProgressTimer();
  if(!PL.id||!PL.ep)return;
  const t=PL.anime?"anime":(PL.type||"tv");
  const epObj=(PL.eps||[]).find(x=>x.episode_number===PL.ep);
  const durMin=(epObj&&epObj.runtime)?epObj.runtime:(PL.anime?24:45);
  const dur=durMin*60;
  let sec=(PROGDB[progKey(t,PL.id,PL.s,PL.ep)]&&PROGDB[progKey(t,PL.id,PL.s,PL.ep)].sec)||0;
  progTimer=setInterval(()=>{
    sec+=10;
    setProgSec(t,PL.id,PL.s,PL.ep,sec,dur);
    const pct=Math.min(100,Math.round((sec/dur)*100));
    const bar=document.querySelector(`.ep[data-ep="${PL.ep}"] .ep-bar-fill`);
    if(bar)bar.style.width=pct+"%";
  },10000);
}

/* ── normalización de items TMDB ── */
// Algunos animes no tienen traducción al español cargada en TMDB, y ahí
// TMDB devuelve el título "principal" que tengan guardado — que en algunas
// fichas está mal cargado en chino en vez de japonés/inglés. Si detectamos
// eso (caracteres chinos sin nada de kana japonés mezclado), usamos el
// título original como respaldo.
function looksChineseOnly(s){
  if(!s)return false;
  const hasCJK=/[\u4E00-\u9FFF]/.test(s);
  const hasKana=/[\u3040-\u30FF]/.test(s);
  return hasCJK&&!hasKana;
}
function norm(i){
  const type=i.media_type||(i.title?"movie":"tv");
  const isAnime=(i.genre_ids||[]).includes(16)&&i.original_language==="ja";
  let title=i.title||i.name||"";
  const origTitle=i.original_title||i.original_name||"";
  if(looksChineseOnly(title)&&origTitle&&!looksChineseOnly(origTitle))title=origTitle;
  return {
    id:i.id,type,isAnime,
    title,
    origTitle,
    poster:i.poster_path||"",back:i.backdrop_path||"",
    rating:i.vote_average?i.vote_average.toFixed(1):"",
    year:(i.release_date||i.first_air_date||"").slice(0,4),
    desc:i.overview||""
  };
}

function shareLink(n){
  const base=location.origin+location.pathname;
  return `${base}?v=${n.type}-${n.id}`;
}
async function shareItem(n){
  const url=shareLink(n);
  const text=`Mirá "${n.title}" en ShockTV`;
  try{
    if(navigator.share){await navigator.share({title:"ShockTV — "+n.title,text,url});return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  try{
    await navigator.clipboard.writeText(`${text}: ${url}`);
    toast("Enlace copiado");
  }catch(e){

const PLY_SANDBOX="allow-scripts allow-same-origin allow-forms allow-presentation allow-fullscreen";
// Fuentes alternas: necesitan algo más de permisos para reproducir bien,
// pero NUNCA "allow-popups" ni "allow-top-navigation" sin gesto real del usuario.
// Así, si el embed intenta abrir un popup de publicidad, el navegador lo bloquea
// solo y la app nunca "sale" hacia el navegador del teléfono.
const PLY_SANDBOX_LOOSE="allow-scripts allow-same-origin allow-forms allow-presentation allow-fullscreen allow-orientation-lock";
// Cinetoons prueba activamente si puede abrir window.open() y si no puede,
// se niega a reproducir (mensaje "Sandboxed our player") — y seguía
// negándose incluso con allow-popups puesto, así que su chequeo detecta
// algo más del sandbox. La única forma comprobada de que reproduzca es
// SIN sandbox (sandbox:false, más abajo). Es una decisión consciente del
// dueño de la app: sabiendo que reintroduce el riesgo de popups/ventanas
// para esta fuente puntual, el resto de las fuentes quedan protegidas.
// Un .m3u8 (o un archivo de video directo: .mp4/.webm/.mov/etc) puesto
// directo como src de iframe NO reproduce bien (HLS no tiene soporte nativo
// en Chrome/Firefox/Android, y los archivos directos a veces tampoco andan
// bien metidos crudo como src de iframe). Por eso se arma un reproductor
// real (<video>, con hls.js solo si hace falta) adentro del iframe.
function isHLSUrl(u){return /\.m3u8/i.test(u||"");}
function isDirectVideoUrl(u){return /\.(m3u8|mp4|webm|mov|mkv|m4v)(\?|#|$|&)/i.test(u||"")||/\.(m3u8|mp4|webm|mov|mkv|m4v)$/i.test((u||"").split("?")[0]);}
// Algunos proveedores mandan cabeceras (X-Frame-Options / CSP frame-ancestors) que
// bloquean CUALQUIER intento de mostrarlos dentro de un iframe (net::ERR_BLOCKED_BY_RESPONSE).
// Eso no se puede evitar desde el cliente: si el dominio está en esta lista, ni
// intentamos iframearlo, mostramos directamente la salida de "abrir en pestaña nueva".
// Si aparecen más proveedores con el mismo error, se agregan acá.
const BLOCKED_EMBED_HOSTS=["zilla-networks.com"];
function isBlockedEmbedHost(u){
  try{const h=new URL(u,location.href).hostname.toLowerCase();
    return BLOCKED_EMBED_HOSTS.some(b=>h===b||h.endsWith("."+b));
  }catch(e){return false;}
}
function hlsPlayerDoc(url){
  return `<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    color:#ddd;font:14px/1.4 system-ui,sans-serif;padding:24px;background:#000}
</style></head><body>
  <video id="v" controls autoplay playsinline webkit-playsinline></video>
  <div id="msg"></div>
  <script src="data:text/javascript;base64,${HLS_JS_B64}"><\/script>
  <script>
    var video=document.getElementById('v'), msg=document.getElementById('msg');
    var src=${JSON.stringify(url)};
    var isM3u8=/\.m3u8/i.test(src);
    function showMsg(t){video.style.display='none';msg.style.display='flex';msg.textContent=t;}
    function fail(){try{parent.postMessage({shocktvVideoError:true},'*');}catch(e){}
      showMsg('No se pudo reproducir este video. Probando otra fuente…');}
    try{
      if(!isM3u8){
        video.src=src;
        video.addEventListener('error',fail);
      }else if(video.canPlayType('application/vnd.apple.mpegurl')){
        video.src=src;
        video.addEventListener('error',fail);
      }else if(window.Hls&&Hls.isSupported()){
        var hls=new Hls({});
        hls.on(Hls.Events.ERROR,function(ev,data){if(data&&data.fatal)fail();});
        hls.loadSource(src);hls.attachMedia(video);
        video.play().catch(function(){});
      }else{
        showMsg('Tu navegador no soporta este video. Probá otra fuente.');
      }
    }catch(e){fail();}
  <\/script>
</body></html>`;
}

// Fuentes alternas (Cinetoons y Latino Stream). Cinetoons detecta y rechaza
// el sandbox más cerrado (no reproduce si le sacás allow-same-origin), así
// que va con el sandbox "loose": reproduce bien, pero no es 100% infalible
// contra publicidad agresiva — ya lo probamos a fondo. Igual nunca lleva
// allow-popups ni allow-top-navigation, así que la gran mayoría de los
// intentos de escape quedan bloqueados o se muestran adentro de la app.
// Latino Stream Finder busca por texto (no por TMDB id), así que si le
// mandamos el título traducido puede confundirse con otro contenido
// (justo lo que pasaba con series como "Dr. House"). Le mandamos el
// título ORIGINAL (más único para buscar) + el año, para que ate mejor.
// Consulta CinePro Core (OMSS) y devuelve sus streams como fuentes directas.
// Endpoints OMSS:
//   Película: GET /v1/movies/{tmdbId}?platform=web
//   Serie:    GET /v1/tv/{tmdbId}/seasons/{s}/episodes/{e}?platform=web
// Respuesta: { sources:[ {url, type:"hls"|"mp4", quality, ...} ] }
async function cineproSources(){
  if(!PL.id) return [];
  const s=PL.s||1, e=PL.ep;
  // Pega al PROXY del backend propio (no a CinePro directo).
  const url = PL.type==="movie"
    ? `${API_BASE}/api/cinepro/movies/${PL.id}?platform=web`
    : `${API_BASE}/api/cinepro/tv/${PL.id}/seasons/${s}/episodes/${e}?platform=web`;
  try{
    const r=await fx(url,{headers:{accept:"application/json"}},9000);
    if(!r.ok) return [];
    const d=await r.json();
    const arr=Array.isArray(d?.sources)?d.sources:[];
    return arr
      .filter(x=>x&&x.url)
      .map(x=>({
        label:`CinePro · ${x.provider?.name||x.type||"stream"}${x.quality?" "+String(x.quality).toUpperCase():""}`,
        tag:"DIRECTO",
        url:x.url,
        sandbox:false,
        direct:true          // fuerza el reproductor HLS.js embebido (no iframe)
      }));
  }catch(e){ return []; }
}

// ZonaAPI (apizonalatamsrc.xzod.cloud): a diferencia de JKAnime, esta sí
// tiene endpoint de extracción real (/extract?url=), y devuelve un link HLS
// directo. Igual no hay búsqueda por texto, así que el slug de zonaaps.com
// se adivina a partir del título (mismo criterio "mejor esfuerzo").
// Por ahora solo para PELÍCULAS — el patrón de URL de series en zonaaps.com
// todavía no está confirmado.
// ZonaAPI (apizonalatamsrc.xzod.cloud): tiene un catálogo real vía /list
// (paginado). Lo cacheamos una sola vez y buscamos por título ahí, que es
// mucho más confiable que adivinar el slug. Si el título no está en ese
// catálogo, cae de respaldo al modo "mejor esfuerzo" (adivinar el slug).
let ZONA_CATALOG=null,ZONA_CATALOG_P=null;
function normTitle(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
}
async function loadZonaCatalog(){
  if(ZONA_CATALOG)return ZONA_CATALOG;
  if(ZONA_CATALOG_P)return ZONA_CATALOG_P;
  ZONA_CATALOG_P=(async()=>{
    let all=[];
    try{
      const base="https://apizonalatamsrc.xzod.cloud/list";
      const first=await(await fx(`${base}?page=1`,{},9000)).json();
      all=all.concat(first.featured||[],first.movies||[]);
      const totalPages=Math.min(first.totalPages||1,20);
      const rest=await Promise.all(Array.from({length:Math.max(0,totalPages-1)},(_,i)=>
        fx(`${base}?page=${i+2}`,{},9000).then(r=>r.json()).catch(()=>null)));
      for(const d of rest)if(d)all=all.concat(d.featured||[],d.movies||[]);
    }catch(e){}
    ZONA_CATALOG=all;
    return all;
  })();
  return ZONA_CATALOG_P;
}
// Comparación por palabras compartidas (Jaccard), no por "contiene" —
// "Avatar" (la peli) es sub-cadena de "Avatar: La Leyenda de Aang" y con el
// chequeo viejo de "contains" los confundía. Así ya no.
function tokenSet(s){return new Set(normTitle(s).split(" ").filter(Boolean));}
function titleSimilarity(a,b){
  const A=tokenSet(a),B=tokenSet(b);
  if(!A.size||!B.size)return 0;
  let inter=0;for(const t of A)if(B.has(t))inter++;
  const union=A.size+B.size-inter;
  return union?inter/union:0;
}
function findInZonaCatalog(catalog,title,year){
  const nt=normTitle(title);
  if(!nt)return null;
  let best=null,bestScore=0;
  for(const it of catalog){
    const cn=normTitle(it.title);
    if(!cn)continue;
    let score=cn===nt?1:titleSimilarity(title,it.title);
    if(year&&it.year&&String(it.year)===String(year))score+=0.15;
    if(score>bestScore){bestScore=score;best=it;}
  }
  return bestScore>=0.55?best:null;
}
// Reintenta un pedido a /extract un par de veces: a veces la cadena de
// extracción interna del scraper (dooplayer→embed-pro→config de video…)
// falla sola y devuelve streams:[] con status "success" igual, sin marcar
// error — reintentar de nuevo suele resolverlo.
async function fetchZonaExtract(extractUrl,tries=2){
  for(let i=0;i<tries;i++){
    try{
      const r=await fx(extractUrl,{},9000);
      const d=await r.json();
      const st=(d.streams||[]).find(s=>s&&s.url);
      if(st)return st;
    }catch(e){}
    if(i<tries-1)await new Promise(res=>setTimeout(res,800));
  }
  return null;
}
async function zonaApiSource(){
  try{
    const catalog=await loadZonaCatalog();
    const match=findInZonaCatalog(catalog,PL.title,PL.year)||findInZonaCatalog(catalog,PL.origTitle,PL.year);
    let extractUrl;
    if(match){
      extractUrl=match.extractUrl||`https://apizonalatamsrc.xzod.cloud/extract?url=${encodeURIComponent(match.url)}`;
    }else{
      const slug=slugifyJK(PL.title||PL.origTitle);
      if(!slug)return null;
      const target=`https://zonaaps.com/movies/${slug}/`;
      extractUrl=`https://apizonalatamsrc.xzod.cloud/extract?url=${encodeURIComponent(target)}`;
    }
    const st=await fetchZonaExtract(extractUrl);
    if(!st)return null;
    return {label:"ZonaAPI",tag:"ALTERNO",url:st.url,sandbox:false,direct:true};
  }catch(e){return null;}
}

}

// JKAnime, "mejor esfuerzo": no hay endpoint de búsqueda por texto en el
// proxy (over.xzod.cloud/scrappers/jkanime), así que armamos el slug
// adivinando a partir del título original (como arma jkanime sus propias
// URLs). Puede no coincidir para todos los animes — si el slug está mal,
// esta fuente simplemente no va a reproducir nada, como cualquier otra
// fuente que falle.
function slugifyJK(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")   // saca acentos
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}
function jkanimeSource(ep){
  const slug=slugifyJK(PL.title||PL.origTitle);
  if(!slug)return null;
  const target=`https://jkanime.net/${slug}/${ep}/`;
  const url=`https://over.xzod.cloud/scrappers/jkanime/proxy.php?url=${encodeURIComponent(target)}`;
  return {label:"JKAnime",tag:"ALTERNO",url,sandbox:false};
}
async function playEp(ep){
  PL.ep=ep;el("ply-badge").textContent=`Temporada ${PL.s} · Ep ${ep}`;
  document.querySelectorAll(".ep").forEach(x=>x.classList.toggle("on",x.dataset.ep==String(ep)));
  startProgressTimer();
  window.scrollTo(0,0);
  if(PL.anime){
    el("ply-ph").classList.remove("hidden");el("ply-ph").innerHTML="Buscando fuentes…";el("ply-load").classList.add("hidden");
    const av1=await animeServersFor(PL.s,ep);      // AnimeAV1 de ESA temporada
    const jk=jkanimeSource(ep);
    const zn=await zonaApiSeriesSource(PL.s,ep);    // mismo patrón /episodes/ que series normales
    PL.sources=av1.concat(jk?[jk]:[],zn?[zn]:[],await altSources());  // + JKAnime + ZonaAPI + Cinetoons/Latino
    if(!PL.sources.length){el("ply-ph").innerHTML=`No hay fuentes para el Ep ${ep}.
      <button class="btn-play" onclick="playEp(${ep})">Reintentar</button>`;return;}
    el("ply-ph").classList.add("hidden");
    playSources();
  }else{
    el("ply-load").classList.remove("hidden");
    const zn=await zonaApiSeriesSource(PL.s,ep);
    PL.sources=(zn?[zn]:[]).concat(await altSources());
    playSources();
  }
}

/* ═══════════════ REPRODUCTOR (anime, backend AnimeAV1) ═══════════════
   Estructura anclada en las temporadas de TMDB (igual que las series).
   Para cada temporada, AnimeAV1 BUSCA su entrada propia (no reproduce la
   primera que aparece), porque suele tener una entrada distinta por
   temporada. Cinetoons/Latino usan la temporada/episodio de TMDB. */

// Devuelve las fuentes de AnimeAV1 para (temporada, episodio).
async function animeServersFor(season,ep){
  const collect=(arr,tag)=>(Array.isArray(arr)?arr:[]).map(s=>({label:(s.server||s.name||"AnimeAV1"),tag,url:(s.url||s.link||s.embed),sandbox:false})).filter(s=>s.url);
  try{
    const res=await resolveAnimeEpisode(season,ep);
    if(!res)return [];                       // no se pudo emparejar con confianza → alternos
    const d=await animeAPI("episode",{slug:res.slug,number:res.number});
    const data=d?.data||{};const srv=data.servers||{};
    let av1=collect(srv.sub,"SUB").concat(collect(srv.dub,"DUB"));
    if(!av1.length){const sl=data.streamLinks||{};av1=collect(sl.SUB,"SUB").concat(collect(sl.DUB,"DUB"));}
    return av1;
  }catch(e){return [];}
}
/* Normalización de títulos para comparar franquicias. */
function normTitle(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();}
function franchiseKey(t){
  const w=normTitle(t).split(" ").filter(x=>x.length>1);
  if(!w.length)return normTitle(t);
  return w[0].length>=5?w[0]:w.slice(0,2).join(" ");
}
/* Trae TODAS las entradas de la franquicia en AnimeAV1 y las ordena por
   AÑO (serie antes que película/OVA). Así T1 = la más vieja, T2 = la
   siguiente, etc. — funciona con secuelas que cambian de nombre. */
async function loadAnimeFranchise(){
  if(PL.animeFranchise)return PL.animeFranchise;
  const seen={},all=[];
  const q0=PL.title||"";
  const queries=[q0, q0.split(":")[0].trim(), q0.replace(/\(.*?\)/g,"").trim()];
  if(PL.origTitle&&/[a-z]/i.test(PL.origTitle))queries.push(PL.origTitle);
  for(const q of [...new Set(queries.filter(Boolean))]){
    try{
      const r=await animeAPI("search",{q});
      const list=r?.data?.results||r?.results||[];
      for(const it of (Array.isArray(list)?list:[])){
        const slug=it.slug||it.id||it.url;if(!slug||seen[slug])continue;seen[slug]=1;
        all.push({slug,title:it.title||it.name||"",year:parseInt(it.year)||0,type:(it.type||"").toLowerCase()});
      }
    }catch(e){}
    if(all.length>=10)break;
  }
  const key=franchiseKey((PL.origTitle&&/[a-z]/i.test(PL.origTitle))?PL.origTitle:PL.title);
  let fr=all.filter(x=>normTitle(x.title).includes(key));
  if(!fr.length)fr=all;
  fr.sort((a,b)=>{
    const am=/pel|movie|ova|especial|special/.test(a.type)?1:0,bm=/pel|movie|ova|especial|special/.test(b.type)?1:0;
    if(am!==bm)return am-bm;
    return (a.year||9999)-(b.year||9999);
  });
  PL.animeFranchise=fr;PL.franchiseKey=key;
  return fr;
}
function absoluteEp(season,ep){
  let base=0;for(const s of (PL.seasons||[]))if(s.season_number<season)base+=(s.episode_count||0);
  return base+ep;
}
/* Devuelve {slug, number} para (temporada, episodio) o null si no hay match confiable. */
async function resolveAnimeEpisode(season,ep){
  const fr=await loadAnimeFranchise();
  if(!fr.length)return null;
  let chosen=null,number=ep;
  if(fr.length>=season){chosen=fr[season-1];number=ep;}
  else if(fr.length===1){chosen=fr[0];number=absoluteEp(season,ep);}   // entrada única con numeración continua
  else{chosen=fr[fr.length-1];number=ep;}
  if(!chosen)return null;
  if(PL.franchiseKey&&!normTitle(chosen.title).includes(PL.franchiseKey))return null; // evita cargar otro anime
  return {slug:chosen.slug,number};
}

// Si la fuente elegida falla al reproducir (link vencido/roto), probamos

window.addEventListener("message",e=>{

  const next=(PL.srcIdx??-1)+1;
  if(PL.sources&&next<PL.sources.length){
    toast("Esa fuente falló, probando la siguiente…");
    setTimeout(()=>pickSource(next),600);

    toast("Ninguna fuente pudo reproducir este contenido.");
  }
});
/* Pantalla completa horizontal: pone el video "de lado" sin depender del
   giro automático del teléfono. Usa Fullscreen API + bloqueo de orientación. */
function fsLandscape(){
  const wrap=el("ply-wrap");if(!wrap)return;
  const req=wrap.requestFullscreen||wrap.webkitRequestFullscreen||wrap.webkitEnterFullscreen;
  const lock=()=>{try{screen.orientation?.lock?.("landscape").catch(()=>{});}catch(e){}};
  if(!req){toast("Tu navegador no permite pantalla completa");return;}
  try{
    const p=req.call(wrap);
    if(p&&p.then)p.then(lock).catch(lock);else lock();
  }catch(e){toast("No se pudo abrir en pantalla completa");}
}
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement){try{screen.orientation?.unlock?.();}catch(e){}}
});

/* ═══════════════ VISITAS TOTALES (contador global real) ═══════════════
   Una visita = una sesión de navegador (sessionStorage evita que las
   recargas de la misma pestaña inflen el número). Orden de fuentes:
   1) Backend propio: POST /api/visits/hit ó GET /api/visits (si algún
      día lo agregás al server de Render, se usa solo).
   2) Abacus (https://abacus.jasoncameron.dev): contador público
      persistente, gratis y sin key. /hit incrementa, /get solo lee.
   Si todo falla, el pie queda en "—" sin romper nada. */
const VISITS_NS="shocktv-app", VISITS_KEY="visitas-totales";
function fmtVisits(n){
  try{return new Intl.NumberFormat("es-AR").format(n);}catch(e){return String(n);}
}
function animateCount(elm,to){
  const start=performance.now(),dur=900,from=Math.max(0,to-Math.min(to,140));
  function step(t){
    const p=Math.min(1,(t-start)/dur),e=1-Math.pow(1-p,3);
    elm.textContent=fmtVisits(Math.round(from+(to-from)*e));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
async function initVisits(){
  const out=el("visits-total");if(!out)return;
  const counted=(()=>{try{return sessionStorage.getItem("stv_visit_counted")==="1";}catch(e){return false;}})();
  const markCounted=()=>{try{sessionStorage.setItem("stv_visit_counted","1");}catch(e){}};
  let total=null;
  /* 1) backend propio, si existe el endpoint */
  try{
    if(!counted){
      const r=await fx(`${API_BASE}/api/visits/hit`,{method:"POST"},6000);
      if(r.ok){const d=await r.json();total=d?.data?.total??d?.total??d?.value;if(total!=null)markCounted();}
    }else{
      const r=await fx(`${API_BASE}/api/visits`,{},6000);
      if(r.ok){const d=await r.json();total=d?.data?.total??d?.total??d?.value;}
    }
  }catch(e){}
  /* 2) respaldo: Abacus */
  if(total==null){
    try{
      const url=`https://abacus.jasoncameron.dev/${counted?"get":"hit"}/${VISITS_NS}/${VISITS_KEY}`;
      const r=await fx(url,{},8000);
      if(r.ok){const d=await r.json();total=d?.value;if(total!=null&&!counted)markCounted();}
    }catch(e){}
  }
  if(total!=null)animateCount(out,Number(total));
}

let bootDone=false;
function hideBoot(){bootDone=true;el("boot")?.classList.add("hidden");}

/* Pide el token con reintentos y timeouts crecientes.
   Cubre el "despertar" del server gratis de Render (30-50s) y la
   latencia extra de una VPN, que era lo que dejaba trabado el logo. */
async function fetchToken(){
  const tries=[8000,14000,22000];
  for(let i=0;i<tries.length;i++){
    if(i>0)bootMsg(i===1?"El servidor está despertando…":"Reintentando conexión…");
    try{
      const r=await fx(`${API_BASE}/api/token`,{cache:"no-store"},tries[i]);
      if(r.ok){const d=await r.json();TOKEN=d.token||"";ANIME_KEY=d.animeKey||"";if(TOKEN)return true;}
    }catch(e){}
    await new Promise(res=>setTimeout(res,700));
  }
  return false;
}
function showConnError(){
  el("app").innerHTML=`<div class="empty">
    <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l22 22"/><path d="M16.7 11.1a6 6 0 0 0-3.8-3.8M5 12.9a10 10 0 0 1 3-2M8.5 16.4a6 6 0 0 1 4-1.9M12 20h.01"/></svg>
    <p><b>No pudimos conectar con el servidor.</b></p>
    <p style="margin-top:8px">Si tenés una <b>VPN</b> activa, puede estar bloqueando o frenando la conexión: probá desactivarla o cambiar de servidor/país. El servidor también puede tardar unos segundos en despertar.</p>
    <button class="load-more" style="margin-top:18px" onclick="retryBoot()">Reintentar</button></div>`;
}
function retryBoot(){
  el("app").innerHTML="";
  el("boot")?.classList.remove("hidden");bootDone=false;
  bootMsg("Reintentando…");

// Aviso para instalar la app (APK). Se muestra como máximo 2 veces en total
// (cuenta guardada en el dispositivo, no por sesión), después nunca más.
// Adentro de tu propia app (empaquetada como APK) no tiene sentido mostrar
// "descargá la app" — el navegador WebView de este tipo de apps lleva una
// marca "wv" en su identificación que un navegador normal (Chrome, etc.)
// no tiene. Con eso detectamos y directamente no mostramos el aviso ahí.
function isInApp(){
  return /; ?wv\)/i.test(navigator.userAgent)||/\bwv\b/i.test(navigator.userAgent);
}
function maybeShowApkPromo(){

      <button style="color:var(--muted);font-size:13px;font-weight:600" onclick="el('apk-promo-ov').remove()">Ahora no</button>
      <p style="color:#555;font-size:10px;margin-top:16px;word-break:break-all">DEBUG UA: ${navigator.userAgent}</p>

async function boot(){
  updFavBadge();
  // Failsafe absoluto: pase lo que pase, el logo no se queda trabado.
  const failsafe=setTimeout(()=>{if(!bootDone){hideBoot();showConnError();}},60000);
  bootMsg("Conectando…");
  let ok=false;
  try{ok=await fetchToken();}catch(e){}
  clearTimeout(failsafe);
  hideBoot();

  try{renderHome();}catch(e){}
  try{openShared();}catch(e){}
  try{startPresence();}catch(e){}
  try{maybeShowApkPromo();}catch(e){}
  // Ads después del primer render (cuando el navegador está libre).
  if("requestIdleCallback" in window)requestIdleCallback(injectAds,{timeout:3000});
  else setTimeout(injectAds,2500);
}
boot();
